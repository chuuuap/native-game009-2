#login:after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,6,15,.2) 0%,rgba(5,6,15,.15) 35%,rgba(5,6,15,.82) 72%,#070813 100%);pointer-events:none}
.loginTop,.brand,.loginCard{position:relative;z-index:2}.loginTop{display:flex;justify-content:space-between;align-items:center;padding:18px 20px}.version{font-size:12px;color:#c5b8ff}.lang{border:1px solid var(--line);background:rgba(7,8,19,.5);backdrop-filter:blur(12px);border-radius:999px;padding:9px 14px}.logo{font-size:clamp(58px,18vw,92px);font-weight:1000;font-style:italic;line-height:.8;letter-spacing:-.04em;background:linear-gradient(110deg,#fff 25%,#e4d7ff 62%,#7bdcff);-webkit-background-clip:text;color:transparent}.crown{font-size:42px;color:#9a6cff;transform:rotate(-8deg);margin-left:7px;margin-bottom:-7px}.rhythm{margin-top:20px;font-weight:850;letter-spacing:.3em;color:#bdc6ff}.rhythm span{background:linear-gradient(90deg,var(--pink),var(--cyan));-webkit-background-clip:text;color:transparent}.tag{margin-top:12px;color:#d2d6e8;font-size:12px;letter-spacing:.12em}
.loginCard{margin:0 16px 20px;padding:22px;border-radius:24px;background:linear-gradient(180deg,rgba(18,22,42,.86),rgba(9,12,25,.95));border:1px solid rgba(255,255,255,.15);backdrop-filter:blur(20px);box-shadow:0 25px 70px rgba(0,0,0,.5)}.loginTitle{text-align:center;letter-spacing:.28em;font-weight:800;font-size:13px;margin-bottom:16px}.inputWrap{display:flex;align-items:center;gap:10px;border:1px solid rgba(197,190,255,.45);border-radius:18px;padding:14px 16px;background:rgba(255,255,255,.035)}#nickname{flex:1;background:none;border:0;outline:0;min-width:0;font-size:15px}#nickname::placeholder{color:#686f88}.count,.hint{font-size:12px;color:var(--muted)}.hint{margin:9px 2px 18px}.start{width:100%;border-radius:18px;padding:16px;border:1px solid transparent;background:linear-gradient(var(--panel2),var(--panel2)) padding-box,linear-gradient(90deg,var(--pink),var(--cyan)) border-box;font-weight:900;letter-spacing:.28em;box-shadow:0 0 32px rgba(139,92,246,.12)}.start:disabled{opacity:.38}

.sectionHead{display:flex;align-items:center;justify-content:space-between;margin:0 0 12px}.sectionTitle{font-weight:900;letter-spacing:.06em}.sectionTitle:before{content:'';display:inline-block;width:7px;height:7px;border-radius:50%;background:linear-gradient(135deg,var(--purple),var(--pink));margin-right:9px;vertical-align:2px}select,.chipBtn{border:1px solid var(--line);background:rgba(255,255,255,.045);border-radius:999px;padding:8px 12px;font-size:12px}.songList{display:flex;flex-direction:column;gap:10px}.song{display:grid;grid-template-columns:72px 1fr auto;gap:12px;align-items:center;width:100%;padding:10px;border:1px solid var(--line);background:linear-gradient(135deg,rgba(18,22,42,.92),rgba(10,13,26,.92));border-radius:18px;text-align:left;box-shadow:0 12px 30px rgba(0,0,0,.18)}.song:active{transform:scale(.992)}.thumb{width:72px;height:72px;border-radius:14px;background-size:cover;background-position:center;display:grid;place-items:center;color:#737b96;font-size:22px;position:relative;overflow:hidden}.new{position:absolute;top:5px;left:5px;background:linear-gradient(90deg,var(--purple),var(--pink));font-size:9px;padding:3px 6px;border-radius:999px;font-weight:900}.title{font-weight:850;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.composer{font-size:12px;color:var(--muted);margin-top:4px}.meta{display:flex;align-items:center;gap:7px;margin-top:7px}.diff{font-size:9px;font-weight:900;padding:3px 7px;border-radius:999px;background:rgba(139,92,246,.18);color:#cdbdff}.stars{font-size:11px;color:#4e5368;letter-spacing:1px}.stars .on{color:var(--yellow)}.best{text-align:right;min-width:84px}.best small{font-size:8px;letter-spacing:.08em;color:var(--muted)}.score{font-weight:850;font-size:13px;margin-top:4px}.grade{font-size:23px;font-weight:1000;background:linear-gradient(180deg,#fff,var(--purple));-webkit-background-clip:text;color:transparent}.empty{padding:56px 10px;text-align:center;color:var(--muted);line-height:1.7}
.rankCard,.profileCard,.statCard,.adminCard{background:var(--panel);border:1px solid var(--line);border-radius:18px}.rankRow{display:grid;grid-template-columns:34px 1fr auto;gap:12px;align-items:center;padding:14px;border-bottom:1px solid var(--line)}.rankRow:last-child{border-bottom:0}.rankRow.me{background:rgba(139,92,246,.11)}.rankNo{text-align:center;font-weight:900;color:var(--muted)}.rankRow:nth-child(1) .rankNo{color:#ffd65a;font-size:18px}.rankNick{font-weight:750}.rankTotal{color:var(--cyan);font-weight:900}.profileCard{padding:18px;display:flex;gap:14px;align-items:center;margin-bottom:14px}.profileCard .avatar{width:56px;height:56px;font-size:20px}.profileName{font-size:18px;font-weight:900}.profileSub{font-size:12px;color:var(--muted);margin-top:4px}.ghost{margin-left:auto;border:1px solid var(--line);background:none;border-radius:10px;padding:8px 10px;font-size:11px;color:var(--muted)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:18px}.statCard{padding:14px 10px;text-align:center}.statCard b{display:block;font-size:18px}.statCard span{font-size:10px;color:var(--muted)}.adminCard{padding:16px;margin-top:18px}.adminCard h3{margin:0 0 8px;font-size:14px}.adminCard p{margin:0 0 12px;color:var(--muted);font-size:12px;line-height:1.55}.adminActions{display:flex;gap:8px;flex-wrap:wrap}.adminActions label,.adminActions button{flex:1;border:1px solid var(--line);background:rgba(255,255,255,.05);padding:10px;border-radius:12px;text-align:center;font-size:12px}
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(4,1fr);align-items:end;padding:9px 8px calc(9px + env(safe-area-inset-bottom));background:rgba(8,9,20,.92);backdrop-filter:blur(20px);border-top:1px solid var(--line)}.nav{border:0;background:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:4px;font-size:9px;padding:5px}.nav.active{color:#fff}.nav svg{width:21px;height:21px}
#player{position:fixed;inset:0;z-index:90;background:#05060d;display:none}#player.show{display:block}#player iframe{width:100%;height:100%;border:0}.closePlayer{position:absolute;z-index:2;top:14px;left:14px;border:1px solid var(--line);background:rgba(8,9,20,.74);backdrop-filter:blur(10px);border-radius:999px;padding:9px 13px}
#toast{position:fixed;z-index:100;left:50%;bottom:100px;transform:translate(-50%,18px);opacity:0;transition:.2s;background:#11152a;border:1px solid var(--line);padding:11px 14px;border-radius:12px;max-width:88vw;text-align:center;font-size:12px}#toast.show{opacity:1;transform:translate(-50%,0)}

/* Responsive login fit: preserve the 853×1844 reference without crop or scroll, on any phone size */
html,body{width:100%;min-height:100%;overflow-x:hidden;overflow-y:auto;overscroll-behavior-x:none}
#login{
  width:100vw;
  height:100svh;
  min-height:0;
  overflow:hidden;
  overscroll-behavior:none;
  display:grid;
  place-items:center;
  padding:0;
  background:#070813;
}
#login .loginReference{
  position:relative;
  width:min(100vw,calc(100svh * 853 / 1844));
  height:min(100svh,calc(100vw * 1844 / 853));
  min-height:0;
  max-height:none;
  margin:0;
  aspect-ratio:853 / 1844;
  flex:none;
  overflow:hidden;
  background-size:100% 100%;
  background-position:center;
  background-repeat:no-repeat;
}
@supports (height:100dvh){
  #login{height:100dvh}
  #login .loginReference{
    width:min(100vw,calc(100dvh * 853 / 1844));
    height:min(100dvh,calc(100vw * 1844 / 853));
  }
}
@media (min-width:521px){
  #login{max-width:none;margin:0;box-shadow:none;place-items:center}
  #login .loginReference{min-height:0;height:min(100svh,calc(100vw * 1844 / 853));max-height:none}
}

const gameHtmlMem=new Map();

  if(typeof value!=='string')return '';

async function fetchGameHtml(g,{force=false}={}){

const FAST_DB='native_on_air_fast_cache_v2';
function openFastDb(){
  return new Promise((resolve,reject)=>{
    const req=indexedDB.open(FAST_DB,1);
    req.onupgradeneeded=()=>{const db=req.result;if(!db.objectStoreNames.contains('cache'))db.createObjectStore('cache')};
    req.onsuccess=()=>resolve(req.result);
    req.onerror=()=>reject(req.error);
  });
}
async function fastGet(key){
  try{
    const db=await openFastDb();
    return await new Promise((resolve,reject)=>{
      const tx=db.transaction('cache','readonly');
      const req=tx.objectStore('cache').get(key);
      req.onsuccess=()=>resolve(req.result||null);
      req.onerror=()=>reject(req.error);
    });
  }catch(e){return null}
}

          if(game.life<=0){game.finishReason='life';game.running=false;audio.pause();reportScore();return}
          continue;
        }
        if(now>=n.time+(n.hold||0)){game.judged.add(n.id);delete game.holdActive[n.id];game.feedback='PERFECT';game.life=Math.min(100,(game.life??100)+5);continue}

async function openGame(g){
  if(!g)return;
  playing=g;
  $('#player').classList.add('show');
  const frame=$('#frame');
  frame.src='about:blank';

  const showLoadError=(detail)=>{
    const safe=String(detail||'알 수 없는 오류').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    frame.srcdoc=`<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
      *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#070813;color:#fff;font-family:Pretendard,Inter,system-ui,sans-serif}
      body{display:grid;place-items:center;padding:24px}.box{max-width:520px;text-align:center}.icon{font-size:42px}.title{font-size:20px;font-weight:900;margin:12px 0 8px}.desc{font-size:14px;line-height:1.6;color:#b9bfd3}.detail{margin-top:14px;padding:10px 12px;border:1px solid rgba(255,255,255,.12);border-radius:10px;background:#11152a;color:#8e98ba;font-size:11px;word-break:break-all}
    </style></head><body><div class="box"><div class="icon">⚠️</div><div class="title">게임을 불러오지 못했어요</div><div class="desc">목록으로 돌아간 뒤 다시 눌러주세요.<br>계속 반복되면 아래 오류 내용을 알려주세요.</div><div class="detail">${safe}</div></div></body></html>`;
  };

  const mountGame=(html)=>{
    try{
      if(typeof html!=='string' || !html.trim()) throw new Error('GAME_HTML_EMPTY');
      const prepared=preparePlayableHtml(html,g);
      if(typeof prepared!=='string' || !prepared.trim()) throw new Error('PREPARED_HTML_EMPTY');
      frame.srcdoc=prepared;
      return true;
    }catch(err){
      console.error('game prepare/mount failed',err);
      showLoadError('prepare: '+(err?.message||err));
      return false;
    }
  };

  // 곡 목록 조회에서 이미 game_html을 받았다면 추가 네트워크 요청 없이 즉시 실행.
  const readyHtml=g.file||getCachedGameHtml(g.id);
  if(readyHtml){ mountGame(readyHtml); return; }

  frame.srcdoc=`<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{display:grid;place-items:center;background:radial-gradient(circle at 50% 42%,rgba(145,87,255,.26),transparent 32%),linear-gradient(180deg,#080814,#030309);color:#fff;font-family:Pretendard,Inter,system-ui,sans-serif}.loader{text-align:center}.ring{width:54px;height:54px;margin:0 auto 18px;border-radius:50%;border:4px solid rgba(255,255,255,.12);border-top-color:#b95cff;border-right-color:#4fdcff;animation:spin .75s linear infinite}.msg{font-size:14px;color:#cbc7dc}@keyframes spin{to{transform:rotate(360deg)}}
  </style></head><body><div class="loader"><div class="ring"></div><div class="msg">게임 불러오는 중…</div></div></body></html>`;

  try{
    // 게임 HTML은 용량이 클 수 있어 고정 7초 타임아웃으로 정상 요청을 끊지 않는다.
    // 먼저 일반 조회를 기다리고, 실패/빈 응답일 때 캐시를 한 번 더 확인한다.
    let html=await fetchGameHtml(g);
    if(!html){
      html=g.file||getCachedGameHtml(g.id)||'';
    }
    if(!html){ showLoadError('GAME_HTML_NOT_FOUND'); return; }
    mountGame(html);
  }catch(err){
    console.error('openGame failed',err);
    showLoadError('openGame: '+(err?.message||err));
  }
}

async function showSongResult(game,score,finishReason,xpGain,oldLevel){
  $('#resultTitle').textContent=finishReason==='life'?'LIFE 소진 · 게임 종료':(game.title||'플레이 결과');
  $('#resultScore').textContent=Number(score).toLocaleString();
  $('#resultRank').textContent='랭킹 집계 중…';
  $('#songTop10').innerHTML='<div class="empty">기록을 불러오는 중…</div>';
  const lp=levelProgress(totalXp);$('#resultLevelText').textContent='Lv. ' + lp.lv;$('#resultXpGain').textContent='+'+(xpGain||0).toLocaleString()+' XP'+(lp.lv>oldLevel?' · LEVEL UP!':'');$('#resultLevelFill').style.width=lp.pct+'%';$('#resultModal').classList.add('show');
  let rows=[];
  if(sb){
    try{
      const {data,error}=await sb.from('scores').select('nickname,score,grade').eq('song_id',game.id).order('score',{ascending:false});
      if(error)throw error;
      rows=data||[];
    }catch(err){console.error(err)}
  }
  // Defensive de-duplication by nickname, keeping the maximum score.
  const bestByNick={};
  rows.forEach(r=>{const v=+r.score||0;if(!bestByNick[r.nickname]||v>bestByNick[r.nickname].score)bestByNick[r.nickname]={nickname:r.nickname,score:v,grade:r.grade||grade(v)}});
  const ranking=Object.values(bestByNick).sort((a,b)=>b.score-a.score);
  const myIndex=ranking.findIndex(r=>r.nickname===nick);
  if(finishReason!=='life')$('#resultTitle').textContent=game.title||'플레이 결과';
  $('#resultRank').innerHTML=myIndex>=0?`총 <b>${ranking.length}</b>명 중 <b>${myIndex+1}</b>등`:`총 <b>${ranking.length}</b>명 참여`;
  $('#songTop10').innerHTML=ranking.length?ranking.slice(0,10).map((r,i)=>`<div class="songRankRow ${r.nickname===nick?'me':''}"><div class="songRankNo">${i+1}</div><div class="songRankNick">${esc(r.nickname)}${r.nickname===nick?' · 나':''}</div><div class="songRankScore">${r.score.toLocaleString()}</div></div>`).join(''):'<div class="empty">아직 집계된 기록이 없어요.</div>';
}

});

<script>
(function(){
  const BASE_W=430;
  const BASE_H=930;
  const GAP=16;
  const root=document.documentElement;
  const login=document.getElementById('login');

  function fitFixedLogin(){
    if(!login || login.hidden || getComputedStyle(login).display==='none') return;
    const vw=Math.max(0, window.innerWidth-GAP);
    const vh=Math.max(0, (window.visualViewport ? window.visualViewport.height : window.innerHeight)-GAP);
    const scale=Math.min(1, vw/BASE_W, vh/BASE_H);
    root.style.setProperty('--fixed-login-scale', String(Math.max(.1, scale)));
  }

  function syncLoginState(){
    if(!login) return;
    const open=!login.hidden && getComputedStyle(login).display!=='none';
    document.body.classList.toggle('login-screen-open', open);
    if(open) fitFixedLogin();
  }

  window.addEventListener('resize', fitFixedLogin, {passive:true});
  window.addEventListener('orientationchange', fitFixedLogin, {passive:true});
  if(window.visualViewport){
    window.visualViewport.addEventListener('resize', fitFixedLogin, {passive:true});
  }
  if(login){
    new MutationObserver(syncLoginState).observe(login,{attributes:true,attributeFilter:['hidden','style','class']});
  }
  if(document.readyState==='loading'){
    document.addEventListener('DOMContentLoaded',()=>{syncLoginState();requestAnimationFrame(fitFixedLogin)});
  }else{
    syncLoginState();requestAnimationFrame(fitFixedLogin);
  }
})();
</script>
